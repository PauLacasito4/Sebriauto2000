<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Vehículos | Sebriauto 2000</title>
    <meta name="description" content="Catálogo de vehículos de ocasión en Sebriauto 2000. Coches revisados y garantizados en Riba-roja de Túria. Filtra por marca, precio, combustible y más.">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/catalogo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <header class="page-header">
        <div class="container">
            <h1 data-i18n="cat-title">Vehículos de Ocasión</h1>
            <p data-i18n="cat-subtitle">Encuentra tu próximo coche totalmente garantizado y revisado.</p>
        </div>
    </header>

    <main class="section">
        <div class="container">
            <!-- Filtros Avanzados Premium -->
            <div class="filters-wrapper">
                <div class="filters-bar">
                    <div class="filter-group">
                        <label for="search-input"><i class="fa-solid fa-search"></i> <span data-i18n="cat-filter-search">Buscador</span></label>
                        <input type="text" id="search-input" placeholder="Modelo, marca...">
                    </div>
                    <div class="filter-group">
                        <label for="filter-brand"><i class="fa-solid fa-tag"></i> <span data-i18n="cat-filter-marca">Marca</span></label>
                        <select id="filter-brand">
                            <option value="" data-i18n="cat-filter-todas">Todas</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-year"><i class="fa-solid fa-calendar-days"></i> <span data-i18n="cat-filter-year">Desde</span></label>
                        <select id="filter-year">
                            <option value="">Cualquiera</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-fuel"><i class="fa-solid fa-gas-pump"></i> <span data-i18n="cat-filter-fuel">Motor</span></label>
                        <select id="filter-fuel">
                            <option value="" data-i18n="cat-filter-cualquiera">Cualquiera</option>
                            <option value="Gasolina">Gasolina</option>
                            <option value="Diésel">Diésel</option>
                            <option value="Híbrido">Híbrido</option>
                            <option value="Eléctrico">Eléctrico</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-transmission"><i class="fa-solid fa-gears"></i> <span data-i18n="cat-filter-transmission">Cambio</span></label>
                        <select id="filter-transmission">
                            <option value="">Cualquiera</option>
                            <option value="Manual">Manual</option>
                            <option value="Automático">Automático</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-label"><i class="fa-solid fa-leaf"></i> <span data-i18n="cat-filter-label">Etiqueta</span></label>
                        <select id="filter-label">
                            <option value="">Cualquiera</option>
                            <option value="0">0</option>
                            <option value="Eco">Eco</option>
                            <option value="C">C</option>
                            <option value="B">B</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><i class="fa-solid fa-euro-sign"></i> <span data-i18n="cat-filter-precio-min">Min</span></label>
                        <select id="filter-price-min">
                            <option value="">0 €</option>
                            <option value="1000">1.000 €</option>
                            <option value="3000">3.000 €</option>
                            <option value="5000">5.000 €</option>
                            <option value="10000">10.000 €</option>
                            <option value="15000">15.000 €</option>
                            <option value="20000">20.000 €</option>
                            <option value="30000">30.000 €</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label><i class="fa-solid fa-euro-sign"></i> <span data-i18n="cat-filter-precio-max">Max</span></label>
                        <select id="filter-price-max">
                            <option value="">Cualquiera</option>
                            <option value="5000">5.000 €</option>
                            <option value="10000">10.000 €</option>
                            <option value="15000">15.000 €</option>
                            <option value="20000">20.000 €</option>
                            <option value="30000">30.000 €</option>
                            <option value="40000">40.000 €</option>
                            <option value="50000">50.000 €</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <button id="reset-filters" class="btn btn-accent btn-full">
                            <i class="fa-solid fa-rotate-left"></i> <span data-i18n="cat-btn-reset">Limpiar</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Grid de Vehículos -->
            <div class="catalog-grid" id="catalog-container">
                <p class="loading-text" data-i18n="loading">Cargando vehículos...</p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/components.js"></script>

    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
