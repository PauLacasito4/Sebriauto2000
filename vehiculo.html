<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Vehículo | Sebriauto 2000</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .vehicle-detail-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            padding: 120px 0 100px;
        }

        /* Galería */
        .gallery-main {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #222;
            border-radius: var(--border-radius);
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .gallery-thumbs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
        }

        .thumb {
            aspect-ratio: 4/3;
            background-color: #222;
            border-radius: 4px;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .thumb.active {
            border-color: var(--accent-color);
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Info */
        .sticky-info {
            position: sticky;
            top: 100px;
        }

        .vehicle-header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .vehicle-header .price {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 30px;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background-color: var(--bg-secondary);
            padding: 30px;
            border-radius: var(--border-radius);
            margin-bottom: 40px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-item .label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .spec-item .value {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .description {
            margin-bottom: 40px;
            color: var(--text-secondary);
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .contact-box {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        @media (max-width: 900px) {
            .vehicle-detail-grid {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 100px 0 60px;
            }
            .sticky-info {
                position: static;
            }
            .vehicle-header h1 {
                font-size: 2rem;
            }
            .vehicle-header .price {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 600px) {
            .gallery-thumbs {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            .specs-grid {
                grid-template-columns: 1fr;
                padding: 20px;
            }
            .contact-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <div class="vehicle-detail-grid" id="detail-container">
            <!-- Cargando... -->
            <p style="text-align: center; grid-column: 1/-1;">Cargando detalles del vehículo...</p>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script type="module" src="js/components.js"></script>
    <script type="module" src="js/vehiculo.js"></script>
</body>
</html>
