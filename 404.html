<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Sebriauto 2000</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        .error-icon {
            font-size: 3rem;
            color: var(--accent-color);
            margin-bottom: 30px;
            animation: spin-slow 4s linear infinite;
            display: inline-block;
        }
        @keyframes spin-slow {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }
        .error-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .error-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.7;
        }
        .error-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="error-page">
        <div>
            <div class="error-icon"><i class="fa-solid fa-wrench"></i></div>
            <div class="error-code">404</div>
            <h1 class="error-title">¡Vaya, esta página no existe!</h1>
            <p class="error-desc">Parece que la página que buscas se ha ido al taller y no ha vuelto. No te preocupes, te llevamos de vuelta a casa.</p>
            <div class="error-btns">
                <a href="index.html" class="btn btn-accent">
                    <i class="fa-solid fa-house" style="margin-right:8px;"></i> Volver al inicio
                </a>
                <a href="catalogo.html" class="btn btn-outline">
                    <i class="fa-solid fa-car" style="margin-right:8px;"></i> Ver vehículos
                </a>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script type="module" src="js/components.js"></script>
</body>
</html>
